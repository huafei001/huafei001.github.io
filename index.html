
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>刘师傅用车服务</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e6f2ff 0%, #d1e7fe 100%);
            min-height: 100vh;
            font-family: 'Arial Rounded MT Bold', sans-serif;
            padding: 20px;
        }

        /* 表情包样式 */
        .meme-container {
            width: 160px;
            height: 160px;
            margin: 0 auto 30px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 1px;
            background: #e6f2ff;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.15);
            overflow: hidden;
        }

        .meme-cell {
            background: white;
        }

        .meme-img {
            grid-column: 1 / 5;
            grid-row: 1 / 5;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .meme-img:hover {
            transform: scale(1.1);
        }

        /* 主标题样式 */
        .main-title {
            text-align: center;
            margin-bottom: 40px;
            color: #1e88e5;
            animation: bounce 3s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 欢迎语横幅 */
        .welcome-banner {
            background: linear-gradient(90deg, #1e88e5, #3b96f7);
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 6px 16px rgba(30, 136, 229, 0.15);
        }

        /* 服务卡片 */
        .service-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(30, 136, 229, 0.1);
        }

        .service-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 20px;
            padding-left: 5px;
            border-left: 3px solid #1e88e5;
            transition: transform 0.3s ease;
        }

        .service-item:hover {
            transform: translateX(8px);
        }

        /* 二维码区域 */
        .qr-section {
            text-align: center;
            margin-top: 30px;
        }

        .qr-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border: 5px solid white;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(30, 136, 229, 0.1);
            margin: 0 auto 15px;
        }

        .qr-tip {
            color: #1e88e5;
            font-size: 14px;
            font-weight: 500;
        }

        /* 入场动画 */
        .fade-in {
            opacity: 0;
            animation: fadeIn 0.8s forwards;
        }

        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- 顶部表情包 -->
    <div class="meme-container fade-in">
        <img src="im.JPG" alt="搞笑表情包" class="meme-img">
    </div>

    <!-- 主标题 -->
    <h1 class="main-title text-[clamp(1.8rem,8vw,3rem)] font-bold fade-in delay-1">
        你还真扫？这是劳资的车！<br>别被我逮到了哟～
    </h1>

    <!-- 欢迎语横幅 -->
    <div class="welcome-banner fade-in delay-1">
        <h2 class="text-[clamp(1.2rem,5vw,1.8rem)] font-bold">文明城市，美丽蚌埠欢迎您！</h2>
        <p class="mt-2 text-blue-100">皖C三件套，等你来打卡！</p>
    </div>

    <!-- 服务内容卡片 -->
    <div class="service-card fade-in delay-2">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                <i class="fa fa-car text-[#1e88e5] text-xl"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800">用车服务</h2>
        </div>

        <div class="space-y-6">
            <div class="service-item">
                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0 mt-1">
                    <i class="fa fa-clock-o text-[#1e88e5]"></i>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800">日常接送</h3>
                    <p class="text-gray-600 text-sm mt-1">市内短途、跨区出行，随叫随到，准时可靠</p>
                </div>
            </div>

            <div class="service-item">
                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0 mt-1">
                    <i class="fa fa-map text-[#1e88e5]"></i>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800">长途包车</h3>
                    <p class="text-gray-600 text-sm mt-1">周边游、商务差旅，全程专属服务，舒适安心</p>
                </div>
            </div>

            <div class="service-item">
                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0 mt-1">
                    <i class="fa fa-plane text-[#1e88e5]"></i>
                </div>
                <div>
                    <h3 class="font-bold text-gray-800">接送机服务</h3>
                    <p class="text-gray-600 text-sm mt-1">准时接送，行李协助，让行程更轻松</p>
                </div>
            </div>
        </div>

        <!-- 二维码区域 -->
        <div class="qr-section">
            <p class="text-gray-700 font-medium mb-4">扫码添加好友，预约用车</p>
            <img src="wx.JPG" alt="刘师傅微信二维码" class="qr-image">
            <p class="qr-tip">长按图片可保存二维码</p>
        </div>
    </div>

    <script>
        // 表情包点击缩放效果
        const memeImg = document.querySelector('.meme-img');
        memeImg.addEventListener('click', () => {
            memeImg.style.transform = 'scale(1.2)';
            setTimeout(() => {
                memeImg.style.transform = 'scale(1)';
            }, 300);
        });
    </script>
</body>
</html>
